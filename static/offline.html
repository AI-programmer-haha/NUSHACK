<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e293b">
    <title>Offline - Security Management</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(100%, 520px);
            padding: 32px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 2px 12px #00000010;
        }
        h1 { margin-top: 0; font-size: 24px; }
        p { line-height: 1.6; color: #475569; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <main>
        <h1>You are offline</h1>
        <p>This page has not been saved on this device yet.</p>
        <p>Reconnect to the internet, open the website, and sign in once. After the locations page and its data have been saved, you can reopen them offline.</p>
        <p><a href="/login-page">Return to the login page</a></p>
    </main>
</body>
</html>
